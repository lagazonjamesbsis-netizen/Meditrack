name: Type Check

on:
  push:
    branches: [catanghal, main, yamo]
  pull_request:

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Meditrack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.x
          cache: npm
          cache-dependency-path: Meditrack/package-lock.json

      - run: npm ci

      - run: npm run type-check
