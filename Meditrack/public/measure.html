<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'bebas'; src: url('/_next/static/media/fabcf92ba1ccea36-s.p.0lwj123ije5i..woff2') format('woff2'); }
  @font-face { font-family: 'asap'; src: url('/_next/static/media/f8ddb1910cac30b6-s.p.091n2ol7nctic.woff2') format('woff2'); }
</style>
</head>
<body>
<script>
(async () => {
  await Promise.all(['bebas','asap'].map(f => document.fonts.load(`100px ${f}`)))
  await document.fonts.ready
  const ctx = document.createElement('canvas').getContext('2d')
  const out = {}
  ctx.font = '100px bebas'
  out.bebasTitle = ctx.measureText('MEDITRACK').width
  ctx.font = '100px asap'
  out.asapSubtitleActual = ctx.measureText('Stay On Track With Us').width
  out.asapSubtitleUpper = ctx.measureText('STAY ON TRACK WITH US').width
  out.bebasStatus = document.fonts.check('100px bebas')
  out.asapStatus = document.fonts.check('100px asap')
  document.title = JSON.stringify(out)
  document.body.textContent = JSON.stringify(out)
})()
</script>
</body>
</html>
